# .github/workflows/ci.yml
#
# CI matrix: 2 cells (Julia {1.10, 1.12} × Ubuntu).
# History:
# - ADR-018 (2026-08-24): reduced from 6-cell {Ubuntu, Windows, macOS} to 2-cell Ubuntu-only for M0-M10.
# - ADR-023 (2026-08-28): attempted macos-latest addition; confirmed infeasible — `using MakieViews`
#   unconditionally loads GLMakie/Gtk4Makie which fail to precompile on headless Apple Silicon GHA VMs
#   (NSGL FORMAT_UNAVAILABLE). Reverted to Ubuntu-only. macOS CI requires conditional backend loading
#   (v0.2 backlog). Windows is validated manually before release (Task 072).

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.12']
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia depot
        uses: julia-actions/cache@v2

      - name: Install xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1

      - name: Run tests (under xvfb)
        run: xvfb-run -a julia --project=. -e 'using Pkg; Pkg.test()'
